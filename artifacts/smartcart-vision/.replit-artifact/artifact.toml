kind = "web"
previewPath = "/"
title = "SmartCart Vision"
version = "1.0.0"
id = "artifacts/smartcart-vision"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 8080

[services.development]
run = "pnpm --filter @workspace/smartcart-vision run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/smartcart-vision", "run", "build" ]
publicDir = "artifacts/smartcart-vision/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "5173"
BASE_PATH = "/"
